<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050816" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="星界覇王" />
  <meta name="description" content="基地を育て、艦隊を編成し、星域を征服せよ。スマホで遊べるインクリメンタル・ストラテジー。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="preload" href="assets/fonts/chakra-petch-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <title>星界覇王 - STELLAR DOMINION</title>
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-glow"></div>
    <img class="splash-logo" src="assets/icon.svg" alt="" width="112" height="112" />
    <div class="splash-title">星界覇王</div>
    <div class="splash-sub">STELLAR DOMINION</div>
    <div class="splash-bar"><i></i></div>
  </div>

  <section id="intro" class="intro hidden" aria-label="はじめに">
    <div class="intro-hero" aria-hidden="true">
      <div id="introVoid" class="intro-void"></div>
      <div id="introFleet" class="intro-fleet"></div>
    </div>
    <div class="intro-body">
      <span id="introLogo" class="intro-logo" aria-hidden="true"></span>
      <span class="kicker">PROLOGUE · 銀河暦 2847</span>
      <h1 class="intro-title">星界覇王</h1>
      <p class="intro-sub">STELLAR DOMINION</p>
      <div class="intro-story">
        <p>統一政府の崩壊から百年。星々は海賊と無人兵器、そして謎の勢力<b>「虚空統制体」</b>に呑まれつつある。</p>
        <p>辺境の小さな前哨基地を託されたあなたは、残された最後の司令官だ。</p>
        <p>資源を集め、艦隊を築き、六つの星域を解放せよ。目指すは銀河の中心<b>「ゼロポイント核」</b>。</p>
      </div>
      <ul id="introSteps" class="intro-steps"></ul>
      <button id="startBtn" class="btn btn-gold btn-wide intro-start"><span class="btn-main">はじめる</span></button>
      <small class="intro-note">進行はこの端末に自動保存されます</small>
    </div>
  </section>

  <div class="space" aria-hidden="true">
    <div class="space-nebula"></div>
    <div class="space-stars far"></div>
    <div class="space-stars near"></div>
  </div>

  <div id="app" class="app">
    <header class="hud">
      <div class="hud-top">
        <div class="brand">
          <span id="brandMark" class="brand-emblem"></span>
          <div class="brand-text"><b>星界覇王</b><small>STELLAR DOMINION</small></div>
        </div>
        <div class="hud-actions">
          <div class="star-pill" id="starPill" aria-label="覇王星"><span id="starIcon"></span><b id="starCount">0</b></div>
          <button id="soundBtn" class="round-btn" aria-label="サウンド切替"></button>
          <button id="helpBtn" class="round-btn" aria-label="遊び方と設定"></button>
        </div>
      </div>
      <div id="resources" class="res-bar" aria-label="資源"></div>
    </header>

    <main class="stage">
      <section id="panel-base" class="panel active" aria-label="司令基地">
        <div id="baseScene" class="scene base-scene">
          <div class="horizon" aria-hidden="true"></div>
          <div class="ground" aria-hidden="true"><div class="ground-grid"></div></div>
          <svg class="conduits" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div id="fleetLayer" class="fleet-layer"></div>
          <div id="facilityLayer" class="facility-layer"></div>
          <button id="surgeBtn" class="surge-btn" aria-label="資源サージ">
            <span class="surge-ring"></span>
            <span class="surge-core"></span>
            <span class="surge-label"><b>サージ</b><small id="surgeValue">+30秒</small></span>
          </button>
        </div>
        <div id="commandDetail" class="sheet detail-sheet" aria-live="polite"></div>
      </section>

      <section id="panel-map" class="panel" aria-label="星域征服">
        <div id="mapScene" class="scene map-scene">
          <svg id="routeSvg" class="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div id="territoryLayer" class="territory-layer"></div>
          <div class="scene-chips">
            <span class="chip" id="stageChip"></span>
            <span class="chip" id="streakChip"></span>
          </div>
        </div>
        <div id="battleCard" class="sheet battle-sheet"></div>
      </section>

      <section id="panel-goals" class="panel panel-scroll" aria-label="任務と超越">
        <div class="section-title"><span>OPERATIONS</span><h2>ミッション</h2></div>
        <div id="missionList" class="mission-list"></div>
        <div class="section-title"><span>LEGACY</span><h2>銀河超越</h2></div>
        <div id="prestigeCard" class="prestige-card"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="メインメニュー">
      <i class="tab-indicator" aria-hidden="true"></i>
      <button class="tab active" data-panel="base"><span class="tab-ico" data-icon="base"></span><small>基地</small></button>
      <button class="tab" data-panel="map"><span class="tab-ico" data-icon="map"></span><small>征服</small><i id="mapBadge" class="badge hidden"></i></button>
      <button class="tab" data-panel="goals"><span class="tab-ico" data-icon="goals"></span><small>任務</small><i id="goalBadge" class="badge hidden"></i></button>
    </nav>
  </div>

  <div id="toastLayer" class="toast-layer" aria-live="polite"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card"><button id="modalClose" class="modal-close round-btn" aria-label="閉じる"></button><div id="modalBody"></div></div>
  </div>
  <div id="battleOverlay" class="battle-overlay hidden" aria-live="assertive"></div>
  <canvas id="fxCanvas" class="fx-canvas" aria-hidden="true"></canvas>
  <div id="flyLayer" class="fly-layer" aria-hidden="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
